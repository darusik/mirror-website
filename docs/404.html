<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Failed to replicate · MIRROR 2027</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Inter:wght@400;500&family=JetBrains+Mono&display=swap" rel="stylesheet">
  <style>
    :root { --ink: #E9EEF8; --ink-2: #B3BEDF; --ink-3: #7F8AB8; --aurora: #5BF2B0; --line: rgba(191, 210, 255, 0.28); }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      background: linear-gradient(180deg, #04061A, #0A0F33 55%, #1A1A55 70%, #070B24); color: var(--ink); font-family: Inter, system-ui, sans-serif; }
    main { max-width: 620px; text-align: center; }
    .code { font-family: Fraunces, Georgia, serif; font-weight: 300; font-size: clamp(90px, 20vw, 170px); line-height: 0.8; letter-spacing: 0.08em; }
    .code.r { transform: scaleY(-1); opacity: 0.25; margin-top: 4px;
      -webkit-mask-image: linear-gradient(0deg, #000, transparent 70%); mask-image: linear-gradient(0deg, #000, transparent 70%); }
    h1 { font-family: Fraunces, Georgia, serif; font-weight: 400; font-size: clamp(26px, 4vw, 36px); margin: 8px 0 12px; }
    p { color: var(--ink-2); line-height: 1.6; }
    ul { text-align: left; display: inline-block; color: var(--ink-3); font-family: "JetBrains Mono", monospace; font-size: 14px; line-height: 1.9; }
    a { display: inline-block; margin-top: 18px; padding: 11px 22px; border-radius: 999px; background: var(--aurora); color: #062418; text-decoration: none; font-weight: 500; }
  </style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <div class="code r" aria-hidden="true">404</div>
    <h1>This page failed to replicate.</h1>
    <p>We followed the URL exactly as reported. Possible causes:</p>
    <ul>
      <li>an unreported hyperparameter</li>
      <li>a different random seed</li>
      <li>a link that only worked on the author’s machine</li>
    </ul>
    <br>
    <a href="/">Return to the original result</a>
  </main>
  <script>
    // Easter egg tracker: record this find for the main page (live from 1 April 2027, or with ?eggs=all)
    if (new Date() >= new Date("2027-04-01") || new URLSearchParams(location.search).get("eggs") === "all") try {
      const KEY = "mirror-eggs";
      const found = JSON.parse(localStorage.getItem(KEY) || "[]");
      if (!found.includes("notFound")) {
        found.push("notFound");
        localStorage.setItem(KEY, JSON.stringify(found));
        localStorage.setItem("mirror-eggs-pending", JSON.stringify("notFound"));
      }
    } catch (e) {}
  </script>
</body>
</html>
