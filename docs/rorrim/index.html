<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>ЯOЯЯIM 7202</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Inter:wght@400;500&family=JetBrains+Mono&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; height: 100%; background: #070B24; overflow: hidden; }
    iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; transform: scaleX(-1); }
    .note {
      position: fixed; z-index: 2; left: 50%; bottom: 20px; transform: translateX(-50%); width: min(520px, calc(100vw - 32px));
      padding: 18px 22px; border-radius: 14px; text-align: center; color: #E9EEF8; font: 15px/1.5 Inter, system-ui, sans-serif;
      background: rgba(18, 26, 72, 0.96); border: 1px solid rgba(91, 242, 176, 0.45); box-shadow: 0 16px 48px rgba(0, 0, 0, 0.5);
    }
    .note h1 { margin: 0 0 6px; font: 400 26px Fraunces, Georgia, serif; letter-spacing: 0.08em; }
    .note p { margin: 0 0 12px; color: #B3BEDF; }
    .note a { color: #062418; background: #5BF2B0; text-decoration: none; padding: 8px 18px; border-radius: 999px; font-weight: 500; display: inline-block; }
    .note button { margin-left: 8px; background: none; border: 1px solid rgba(191, 210, 255, 0.28); color: #B3BEDF; border-radius: 999px; padding: 7px 14px; cursor: pointer; font: inherit; }
    .back {
      position: fixed; z-index: 2; right: 16px; bottom: 16px; padding: 9px 16px; border-radius: 999px; text-decoration: none;
      font: 500 14px Inter, system-ui, sans-serif; color: #062418; background: #5BF2B0; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
    }
    .back[hidden], .note[hidden] { display: none; }
    body.is-frozen { background: radial-gradient(120% 80% at 50% 100%, #2B4C6E 0%, #12204A 45%, #070B24 100%); }
    .note.frozen { top: 50%; bottom: auto; transform: translate(-50%, -50%); border-color: rgba(191, 227, 242, 0.55); }
    .note.frozen h1 { color: #BFE3F2; }
    .note.frozen p { font: italic 20px/1.4 Fraunces, Georgia, serif; color: #E9EEF8; margin-bottom: 16px; }
  </style>
</head>
<body>
  <aside class="note" id="note" hidden>
    <h1>ЯOЯЯIM</h1>
    <p>You’ve reached the other side of the mirror. Everything here is the same, only reversed: a replication with the axes swapped.</p>
    <a href="../">Back to the right side</a><button type="button" id="stay">Stay a while</button>
  </aside>
  <a class="back" id="back" href="../" hidden>← Back to the right side</a>

  <aside class="note frozen" id="frozen" hidden>
    <h1>ЯOЯЯIM</h1>
    <p>Not yet. The lake is still frozen.</p>
    <a href="../">Back to the right side</a>
  </aside>

  <script>
    // The mirrored side opens with the third release (1 April 2027), or with ?eggs=all
    const open = new Date() >= new Date("2027-04-01") || new URLSearchParams(location.search).get("eggs") === "all";

    if (!open) {
      document.body.classList.add("is-frozen");
      document.getElementById("frozen").hidden = false;
    } else {
      const frame = document.createElement("iframe");
      frame.src = "../";
      frame.title = "The MIRROR website, mirrored";
      frame.tabIndex = -1;
      document.body.prepend(frame);
      document.getElementById("note").hidden = false;

      // "Stay a while" folds the note into a small button, so there is always a way back
      document.getElementById("stay").addEventListener("click", () => {
        document.getElementById("note").remove();
        document.getElementById("back").hidden = false;
      });

      // Easter egg tracker: record this find for the main page
      try {
        const KEY = "mirror-eggs";
        const found = JSON.parse(localStorage.getItem(KEY) || "[]");
        if (!found.includes("rorrim")) {
          found.push("rorrim");
          localStorage.setItem(KEY, JSON.stringify(found));
          localStorage.setItem("mirror-eggs-pending", JSON.stringify("rorrim"));
        }
      } catch (e) {}
    }
  </script>
</body>
</html>
